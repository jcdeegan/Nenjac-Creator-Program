  setTimeout(()=>$('#ncN').focus(),60);
  $('#ncGo').onclick=()=>{ const name=$('#ncN').value.trim(); if(!name) return toast('Give them a name'); const c={id:uid(),name,cue:'',img:'',what:$('#ncW').value.trim(),group:$('#ncG').value,status:'Alive',personality:'',quotes:[],voice:'',relationships:'',theme:'',tags:[],custom:[],notes:''};
    NW.chars.unshift(c); touch(); closeSheet(); tap(); push('char',c.id); }; }
function newLoreSheet(seed={}){ openSheet('New lore',`<label class="lab">Title</label><input class="inp" id="nlT" placeholder="The Vault, Gianni's Sweets…" autocapitalize="words" value="${esc(seed.title||'')}">
    <label class="lab">Kind</label><select class="inp" id="nlC">${Object.keys(LORE_CATS).map(c=>`<option ${c===(seed.cat||'Lore')?'selected':''}>${esc(c)}</option>`).join('')}</select>
    <button class="btn pri" id="nlGo">Add to the Bible</button>`);
  setTimeout(()=>$('#nlT').focus(),60);
  $('#nlGo').onclick=()=>{ const l={id:uid(),title:$('#nlT').value.trim()||'Untitled',cat:$('#nlC').value,body:'',tags:[],at:Date.now()}; NW.lore.unshift(l); touch(); closeSheet(); tap(); push('lore',l.id); }; }

/* ---------- character page ---------- */
const STATUS=['Alive','Dead','Dead (plot armor pending)','In jail','Missing','Ghost','Unknown'];
PAGES.char=(id)=>{ const el=document.createElement('div');
  const render=()=>{ const c=byId('chars',id); if(!c){ el.innerHTML=largeHead('Gone')+'<div class="empty"><b>This character was deleted</b></div>'; return; } const col=groupColor(c.group), u=artURL(c.img);
    const used={}; NW.scripts.forEach(s=>{ let cue=null; (s.blocks||[]).forEach(b=>{ if(b.t==='character') cue=b.x; else if(b.t==='dialogue'&&cue&&cueChars(cue).includes(c)) used[s.id]=(used[s.id]||0)+1; else if(!isMem(b.t)) cue=null; }); });
    const usedL=Object.entries(used).sort((a,b)=>b[1]-a[1]);
    el.innerHTML=`<div class="nav"><button class="nbtn back" data-a="back">${I.back}<span>Back</span></button><div class="grow"></div><button class="nbtn" data-a="write" style="width:auto;padding:0 10px;font-weight:700">Write a line</button><button class="nbtn" data-a="more">${I.more}</button></div>
    <div class="scroll"><div class="phead" style="--c:${col}"><button class="big" data-a="pic">${u?`<img src="${esc(u)}" alt="" onerror="this.outerHTML='<span class=ini>${esc(initials(c.name))}</span>'">`:`<span class="ini">${esc(initials(c.name))}</span>`}<span class="cam">${I.cam}</span></button>
      <div class="nm"><input class="title" data-f="name" value="${esc(c.name)}" autocapitalize="words" aria-label="Name"><input class="what" data-f="what" value="${esc(c.what&&c.what!=='(fill in)'?c.what:'')}" placeholder="What are they? (the object)" aria-label="What they are"></div></div>
    <div class="wrap" style="padding-top:12px">
      <div class="fbox"><label class="lab">Status</label><input data-f="status" value="${esc(c.status||'')}" list="stl"><datalist id="stl">${STATUS.map(s=>`<option>${esc(s)}</option>`).join('')}</datalist>
        <label class="lab">Group</label><select data-f="group">${[...new Set([...Object.keys(GROUPS),c.group].filter(Boolean))].map(g=>`<option ${g===c.group?'selected':''}>${esc(g)}</option>`).join('')}</select>
        <label class="lab">Name in scripts</label><input data-f="cue" value="${esc(c.cue||'')}" placeholder="${esc((c.name||'').toUpperCase())}" autocapitalize="characters"></div>
      <div class="fbox"><label class="lab">Personality</label><textarea data-f="personality" rows="2" placeholder="Who they are, in a few lines">${esc(c.personality||'')}</textarea>
        <label class="lab">Voice and speech tics</label><textarea data-f="voice" rows="1" placeholder="all lowercase, says 'brother', only grunts…">${esc(c.voice||'')}</textarea>
        <label class="lab">Relationships</label><textarea data-f="relationships" rows="1" placeholder="Best friend, nemesis, mom…">${esc(c.relationships||'')}</textarea></div>
      <div class="fbox"><label class="lab">Quotes</label>${(c.quotes||[]).map((q,i)=>`<div class="quote"><textarea data-q="${i}" rows="1">${esc(q)}</textarea><button class="x" data-qx="${i}" aria-label="Remove quote">${I.x}</button></div>`).join('')}<button class="add" data-a="addq">${I.plus} Add a quote</button></div>
      <div class="fbox"><label class="lab">Tags</label><div class="tags">${(c.tags||[]).map((t,i)=>`<button class="chip" data-tx="${i}">#${esc(t)} ✕</button>`).join('')}<button class="chip" data-a="addtag">${I.plus} Tag</button></div></div>
      <div class="fbox"><label class="lab">Role in the story</label><select data-f="arc">${CH_ARCS.map(a=>`<option ${(c.arc||'—')===a?'selected':''}>${esc(a)}</option>`).join('')}</select>
        <label class="lab">Alignment</label><div class="algn">${ALIGN.map(([k,l])=>`<button class="${c.align===k?'on':''}" data-al="${k}">${esc(l)}</button>`).join('')}</div></div>
      <div class="fbox"><label class="lab">More about them</label>${(c.custom||[]).map((f,i)=>`<div class="kv"><input data-ck="${i}" value="${esc(f.k)}" placeholder="Field"><input data-cv="${i}" value="${esc(f.v)}" placeholder="…"><button class="x" data-cx="${i}" aria-label="Remove field">${I.x}</button></div>`).join('')}
        <div class="chips" style="margin:8px -14px 0;padding:0 14px">${CH_FIELDS.filter(f=>!(c.custom||[]).some(x=>x.k===f)).slice(0,18).map(f=>`<button class="chip" data-qf="${esc(f)}">+ ${esc(f)}</button>`).join('')}</div><button class="add" data-a="addf">${I.plus} Add your own field</button></div>
      <div class="fbox"><label class="lab">Writer notes</label><textarea data-f="notes" rows="2" placeholder="Arc ideas, continuity, which episode they died in…">${esc(c.notes||'')}</textarea></div>
      ${usedL.length?`<div class="sec">Lines in scripts</div><div class="list">${usedL.slice(0,10).map(([sid,n])=>{ const s=byId('scripts',sid); return s?`<button class="li" data-open="${esc(sid)}"><div class="grow"><b>${esc(s.title||'Untitled')}</b><small>${esc(s.code||'')}</small></div><span class="tiny">${n} line${n>1?'s':''}</span></button>`:''; }).join('')}</div>`:''}
      <input type="file" accept="image/*" id="cPic" hidden></div></div>`;
    requestAnimationFrame(()=>$$('textarea',el).forEach(grow)); };
  const C=()=>byId('chars',id);
  el.addEventListener('input',e=>{ const c=C(); if(!c) return; const t=e.target; if(t.tagName==='TEXTAREA') grow(t);
    if(t.dataset.f){ c[t.dataset.f]=t.dataset.f==='cue'?t.value.toUpperCase():t.value; if(t.dataset.f==='cue'&&t.value!==t.value.toUpperCase()){ const p=t.selectionStart; t.value=t.value.toUpperCase(); t.setSelectionRange(p,p); } }
    if(t.dataset.q!=null) c.quotes[+t.dataset.q]=t.value; if(t.dataset.ck!=null) c.custom[+t.dataset.ck].k=t.value; if(t.dataset.cv!=null) c.custom[+t.dataset.cv].v=t.value; touch(); });
  el.addEventListener('change',e=>{ const c=C(); if(!c) return; const t=e.target;
    if(t.id==='cPic'&&t.files[0]){ shrinkImage(t.files[0]).then(url=>{ c.img=url; touch(); render(); toast('📸 New look saved'); }).catch(()=>toast("Couldn't read that picture",'bad')); return; }
    if(t.dataset.f==='group'||t.dataset.f==='arc'){ c[t.dataset.f]=t.value; touch(); if(t.dataset.f==='group') render(); } });
  el.addEventListener('click',e=>{ const c=C(); const a=e.target.closest('[data-a]')?.dataset.a;
    if(a==='back') return pop(); if(!c) return;
    if(a==='pic') return actions(c.name,[{label:'Take a photo or pick one',run:()=>$('#cPic',el).click()},...(c.img?[{label:'Remove picture',red:true,run:()=>{ c.img=''; touch(); render(); }}]:[])]);
    if(a==='write'){ const ed=NAV.stack.find(p=>p.kind==='script'); if(ed){ while(topPage()!==ed) pop(); ED.mode={t:'dialogue',cue:cueOf(c)}; compRender(); setTimeout(()=>$('#cTa')?.focus(),350); return; }
      return newScriptSheet(); }
    if(a==='more') return actions(c.name,[{label:'Delete character',red:true,run:()=>{ if(!confirm(`Delete ${c.name} from the Bible? Their lines in scripts stay.`)) return; NW.chars=NW.chars.filter(x=>x!==c); touch(); pop(); toast('Deleted'); }}]);
    if(a==='addq'){ c.quotes=c.quotes||[]; c.quotes.push(''); touch(); render(); const qs=$$('[data-q]',el); qs[qs.length-1]?.focus(); return; }

    if(a==='addf'){ c.custom=c.custom||[]; c.custom.push({k:'',v:''}); touch(); render(); const ks=$$('[data-ck]',el); ks[ks.length-1]?.focus(); return; }
    const qx=e.target.closest('[data-qx]'); if(qx){ c.quotes.splice(+qx.dataset.qx,1); touch(); return render(); }
    const tx=e.target.closest('[data-tx]'); if(tx){ c.tags.splice(+tx.dataset.tx,1); touch(); return render(); }
    const cx=e.target.closest('[data-cx]'); if(cx){ c.custom.splice(+cx.dataset.cx,1); touch(); return render(); }
    const qf=e.target.closest('[data-qf]'); if(qf){ c.custom=c.custom||[]; c.custom.push({k:qf.dataset.qf,v:''}); touch(); render(); const vs=$$('[data-cv]',el); vs[vs.length-1]?.focus(); return; }
    const al=e.target.closest('[data-al]'); if(al){ c.align=c.align===al.dataset.al?'':al.dataset.al; touch(); tap(); $$('[data-al]',el).forEach(b=>b.classList.toggle('on',b.dataset.al===c.align)); return; }
    const op=e.target.closest('[data-open]'); if(op){ const s=byId('scripts',op.dataset.open); if(s){ push('script',s.id); setTimeout(()=>{ const i=(s.blocks||[]).findIndex((b,i)=>b.t==='dialogue'&&cueChars(speakerAt(i)||'').includes(c)); if(i>=0) jumpTo(i); },380); } } });
  render(); return {el,refresh:()=>{ if(!el.contains(document.activeElement)||document.activeElement===document.body) render(); }}; };
function shrinkImage(file,max=480){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)), w=Math.round(im.width*k), h=Math.round(im.height*k), cv=document.createElement('canvas'); cv.width=w; cv.height=h; const g=cv.getContext('2d'); g.drawImage(im,0,0,w,h); URL.revokeObjectURL(u);
    const png=/png|gif|webp/.test(file.type); res(cv.toDataURL(png?'image/png':'image/jpeg',.85)); }; im.onerror=()=>{ URL.revokeObjectURL(u); rej(); }; im.src=u; }); }

function saveIdea(t){ const first=t.split('\n')[0]; let title=first.length>70?first.slice(0,first.lastIndexOf(' ',66)>20?first.lastIndexOf(' ',66):66)+'…':first;
  const l={id:uid(),title,cat:'Episode Idea',body:t,tags:['from the phone'],at:Date.now()}; NW.lore.unshift(l); touch(); return l; }
function ideaToScript(l){ if(!l) return; const s=newScript({title:(l.title||'').replace(/…$/,'').replace(/^what if\s*/i,m=>m).slice(0,80),logline:(l.body||l.title||'').split('\n')[0]}); l.ep=s.id; touch(); setRoot('scripts'); push('script',s.id); toast('✍ New script from your idea'); }
function spark(){ const people=NW.chars.filter(c=>c.name&&(c.personality||'').length>20); const pool=people.length>=2?people:NW.chars; if(pool.length<2) return 'What if… (add a couple of characters to the Bible and I can spark ideas from them)';
  const main=pool.filter(c=>(c.tags||[]).includes('main')); const A=pick(main.length>2&&Math.random()<.7?main:pool); let B=pick(pool); for(let k=0;k<8&&B===A;k++) B=pick(pool);
  const places=NW.lore.filter(l=>l.cat==='Location'&&l.title).map(l=>l.title); const P=places.length?pick(places):'the theater';
  const a=A.name.split(' ')[0], b=B.name.split(' ')[0];
  return pick([`What if ${a} and ${b} got locked in ${P} overnight?`,`${a} gets the lead. ${b} does not take it well.`,`What if ${a} had to direct one episode?`,`${a} has to babysit ${b} for a day.`,`${a} and ${b} accidentally swap lives.`,`${a} opens a business at ${P}. It's obviously a front.`,`Everyone forgets ${a}'s birthday except ${b}, who remembers for all the wrong reasons.`,`${a} is convinced ${b} is secretly a spy.`,`What if ${a} and ${b} had to fake being best friends to win something?`,`${a} finds something in ${P} they really shouldn't have.`,`${b} owes ${a} a favor. ${a} picks the worst possible one.`,`What if ${a} went viral for the wrong reason?`]); }

  try{ if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){ DeviceMotionEvent.requestPermission().then(s=>{ if(s==='granted'){ go(); toast('Shake your phone for another one'); } }).catch(()=>{}); } else go(); }catch(e){} }

const S={get chars(){ return NW.chars; },get scripts(){ return NW.scripts; },get lore(){ return NW.lore; },get practice(){ return wxPr(); }};
const wqHash=s=>{ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; };
const wqPick=(a,seed)=>a[(seed==null?Math.floor(Math.random()*a.length):seed%a.length)];
function wqWeek(d=new Date()){ const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-day); const y=t.getUTCFullYear(), w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7); return `${y}-W${String(w).padStart(2,'0')}`; }
const wqMonth=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

  let L=S.chars.filter(c=>c.name&&(n[c.id]||c.img)); if(L.length<4) L=S.chars.filter(c=>c.name); return L.sort((a,b)=>(n[b.id]||0)-(n[a.id]||0)).map(c=>({c,n:n[c.id]||0})); }
function wqPlaces(){ const set=new Set(); S.lore.filter(l=>l.cat==='Location'&&l.title).forEach(l=>set.add(l.title)); S.scripts.forEach(s=>(s.blocks||[]).forEach(b=>{ if(b.t==='scene'&&b.x) set.add(b.x.replace(/^\[|\]$/g,'').replace(/^(INT\.|EXT\.)\s*/i,'')); })); const a=[...set].filter(x=>x.length<40); return a.length?a:['the theater','the lobby','backstage']; }

  {id:'ten',e:'🔟',t:'Exactly 10 lines',d:'A complete scene in exactly 10 lines of dialogue. Not 9. Not 11.',chk:B=>{ const n=wqLines(B).length; return n===10?[]:['n']; },bad:'not 10 lines',live:B=>`${wqLines(B).length}/10 lines`},

  {id:'monologue',e:'🎤',t:'One huge monologue',d:'Somebody gets a 100+ word monologue, and it has to be funny the whole way through.',chk:B=>wqLines(B).some(x=>(x.x.match(/[A-Za-z0-9'’]+/g)||[]).length>=100)?[]:['m'],bad:'no 100-word monologue yet'},

function wqLines(B){ const out=[]; let who=''; (B||[]).forEach((b,i)=>{ if(b.t==='character') who=(b.x||'').toUpperCase().trim(); else if(b.t==='dialogue'||b.t==='lyric') out.push({i,who,x:b.x||''}); else if(b.t!=='paren') who=''; }); return out; }
function wqWeekCon(wk=wqWeek()){ return WQ_CON[wqHash('gym'+wk)%WQ_CON.length]; }
function wqGymStreak(){ const weeks=new Set(S.practice.pieces.filter(p=>p.drill==='gym'&&p.week&&p.done).map(p=>p.week)); let n=0, d=new Date(); if(!weeks.has(wqWeek(d))) d=new Date(d-7*864e5); while(weeks.has(wqWeek(d))){ n++; d=new Date(d-7*864e5); } return n; }

const WQ_LVL={mild:{l:'🙂 Mild',s:120},medium:{l:'😬 Medium',s:75},unhinged:{l:'🤯 Unhinged',s:40}};
function wqChaosCard(level){ const cast=wqCast(), A=wqPick(cast.slice(0,12))?.c, B=wqPick(cast.filter(x=>x.c!==A).slice(0,16))?.c, P=wqPick(wqPlaces());
  const pool=level==='unhinged'?WQ_CHAOS.concat(WQ_CHAOS_X,WQ_CHAOS_X):WQ_CHAOS; return wqPick(pool).replace(/\{A\}/g,A?wqFirst(A):'Somebody').replace(/\{B\}/g,B?wqFirst(B):'somebody else').replace(/\{P\}/g,P); }

/* ---------- 🛗 Odd Couple: two people who never share a scene ---------- */
const WQ_TRAPS=['a stuck elevator','a broken-down car','a jail cell','a walk-in freezer','the theater basement during a blackout','a hospital waiting room','a group therapy session','detention','the DMV','a hot-air balloon','a closet during hide and seek','a ski lift that stopped','a stalled Ferris wheel','a broken bathroom with one key'];
const WQ_WHY=['the door is jammed','they\'re handcuffed together','neither one will lose a bet','the cops are right outside','a storm','they both swore they\'d never leave first','somebody lost the key, and it was one of them','they\'re hiding from the same person'];
function wqOddCouple(){ const cast=wqCast().slice(0,24); if(cast.length<2) return null; const together=new Set();
  S.scripts.forEach(s=>{ let scene=new Set(); const flush=()=>{ const a=[...scene]; a.forEach(x=>a.forEach(y=>{ if(x<y) together.add(x+'|'+y); })); scene=new Set(); };
    (s.blocks||[]).forEach(b=>{ if(b.t==='scene') flush(); else if(b.t==='character'){ const c=charByName(b.x); if(c) scene.add(c.id); } }); flush(); });
  const pairs=[]; for(let i=0;i<cast.length;i++) for(let j=i+1;j<cast.length;j++){ const a=cast[i].c, b=cast[j].c, k=[a.id,b.id].sort().join('|'); if(!together.has(k)) pairs.push([a,b]); }
  const [A,B]=pairs.length?wqPick(pairs.slice(0,60)):[cast[0].c,cast[1].c]; return {a:A.id,b:B.id,where:wqPick([...WQ_TRAPS,...wqPlaces().slice(0,4).map(p=>p+', locked in')]),why:wqPick(WQ_WHY)}; }

const WQ_EP20=[[0,'❄️ Cold open','Hook us in 3 minutes. Something weird is already happening.'],[3,'😬 The problem','What does somebody want, and what\'s in the way?'],[8,'🔥 It gets worse','Every fix makes it worse. Escalate.'],[15,'💥 The big mess','Everything collides. Worst moment.'],[18,'🎤 The button','Wrap it up and end on a laugh.']];
const WQ_WANT=['to win employee of the month','to get famous','to get revenge','to throw the perfect party','to avoid one specific person all day','to win a bet','to get out of a date','to prove they\'re not boring','to return something they broke without anyone noticing','to finally get a day off','to get into a club','to be taken seriously for once','to keep a secret for 24 hours'];
const WQ_BLOCK=['it\'s their own funeral','their nemesis wants the same thing','they\'re grounded','they\'ve been replaced by a clone','nobody can hear them','they\'re stuck babysitting','the theater is on fire','they made a promise they can\'t keep','the cops think they did something','they accidentally became a celebrity','they have to do it in one take'];
function wqPremise(){ const c=wqPick(wqCast().slice(0,14))?.c; return {c:c?.id||'',t:`${c?wqFirst(c):'Somebody'} wants ${wqPick(WQ_WANT)}, but ${wqPick(WQ_BLOCK)}.`}; }

function wqPilot(mo=wqMonth()){ const cast=wqCast().slice(0,16), c=cast.length?cast[wqHash('pilot'+mo)%cast.length].c:null; return {c:c?.id||'',star:c?c.name:'Somebody',fmt:WQ_FMT[wqHash('fmt'+mo)%WQ_FMT.length],month:mo}; }

const wqSpk=B=>{ const n={}; wqLines(B).forEach(x=>n[x.who]=(n[x.who]||0)+1); return n; };
const wqWc=x=>(x.match(/[A-Za-z0-9'’]+/g)||[]).length;
const wqGrp=(B,ok)=>wqLines(B).filter(x=>{ const c=charByName(x.who); return !c||!ok(c,x.who); }).map(x=>x.i);

  {id:'noi',e:'🙅',t:'Nobody says "I"',d:'No I, I\'m, I\'ll, I\'ve, I\'d, me or my. Nobody can talk about themselves. Watch Dean suffer.',chk:B=>wqLines(B).filter(x=>/\b(I|I'm|I’m|I'll|I’ll|I've|I’ve|I'd|I’d|me|my|mine|myself)\b/.test(x.x)).map(x=>x.i),bad:'"I"'},
  {id:'noyou',e:'🫵',t:'Nobody says "you"',d:'The word "you" (and your, you\'re, y\'all) is banned. Talk around each other.',chk:B=>wqLines(B).filter(x=>/\b(you|your|you're|you’re|yours|yourself|y'all|y’all|ya|u)\b/i.test(x.x)).map(x=>x.i),bad:'"you"'},

  {id:'oneworders',e:'🔂',t:'One word per line',d:'Every line of dialogue is a single word. Whole scene. Make it land.',chk:B=>wqLines(B).filter(x=>wqWc(x.x)!==1).map(x=>x.i),bad:'line over one word'},

  {id:'mmlead',e:'🍒',t:'Melissa & Marissa finally get lines',d:'Melissa & Marissa have the MOST lines in the scene. It\'s their moment. Don\'t blow it.',chk:B=>{ const n=wqSpk(B), mm=Object.entries(n).filter(([w])=>/MELISSA|MARISSA/.test(w)).reduce((a,[,v])=>a+v,0); return mm&&mm>=Math.max(0,...Object.entries(n).filter(([w])=>!/MELISSA|MARISSA/.test(w)).map(([,v])=>v))?[]:['n']; },bad:'they don\'t have the most lines yet'},
  {id:'nerdwins',e:'🧮',t:'Nobody tells Nerd to shut up',d:'Nerd talks. A lot. And nobody is allowed to tell him to shut up. Everyone has to actually listen.',chk:B=>wqLines(B).filter(x=>/shut\s*(the\s*\w+\s*)?up|stfu/i.test(x.x)).map(x=>x.i),bad:'somebody told him to shut up'},

  {id:'nums',e:'🔢',t:'Every line has a number',d:'Every line of dialogue has a number in it. Nerd is thrilled.',chk:B=>wqLines(B).filter(x=>!/\d|\b(zero|one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|twenty|thirty|forty|fifty|hundred|thousand|million|billion|dozen|half)\b/i.test(x.x)).map(x=>x.i),bad:'line with no number'},

/* ===================================================================
   🎡 WHEEL OF DOOM (your wheels from the computer)
   =================================================================== */
const WHW={rot:{},res:{},lock:{},spinning:false,last:null,active:null};
const WH_COLORS=['#930000','#4a86e8','#ffc81e','#387520','#f6b26b','#8a52d1','#ff5fa2','#1b2a5e','#2a9d8f','#e76f51'], WH_LIGHT=['#ffc81e','#f6b26b','#ff5fa2','#2a9d8f','#e76f51'];
function whLocal(){ const it=a=>a.map((t,k)=>({id:'d'+k,t,on:true})); return {v:1,active:'doom',history:[],local:true,list:[
  {id:'doom',name:'Wheel of Doom',emoji:'🎡',sentence:'{WHO} {WHAT} in {WHERE}.',reels:[{id:'who',label:'WHO',cast:'main',off:[],items:[]},{id:'what',label:'WHAT',items:it(WX_DOOM.ev)},{id:'where',label:'WHERE',items:it(WX_DOOM.pl)}]},
  {id:'challenge',name:'Challenge Wheel',emoji:'🏆',sentence:"This episode's challenge: {CHALLENGE}.",reels:[{id:'c',label:'CHALLENGE',items:it(WX_DOOM.ch)}]},
  {id:'twist',name:'Plot Twist Wheel',emoji:'🌀',sentence:'Plot twist: {TWIST}.',reels:[{id:'t',label:'TWIST',items:it(WX_DOOM.tw)}]}]}; }
function whData(){ const w=NW.misc?.wheels; if(w&&Array.isArray(w.list)&&w.list.length) return w; return WHW.localData=WHW.localData||whLocal(); }
function whActive(){ const W=whData(); return W.list.find(w=>w.id===(WHW.active||W.active))||W.list[0]; }
function whEntries(reel){ const gone=reel.gone||[], off=reel.off||[]; const cast=(!reel.cast||reel.cast==='none')?[]:NW.chars.filter(c=>c.name&&(reel.cast==='all'||c.group!=='Unfiled')).filter(c=>!off.includes(c.id)).map(c=>({key:'c:'+c.id,t:c.name,char:c}));
  const items=(reel.items||[]).filter(i=>i.on!==false&&String(i.t).trim()).map(i=>({key:'i:'+i.id,t:String(i.t).trim()})); return [...cast,...items].filter(e=>!gone.includes(e.key)); }
const whColor=(i,N)=>{ let c=i%WH_COLORS.length; if(N>1&&i===N-1&&c===0) c=3; return WH_COLORS[c]; };
function whDraw(reel){ const cv=document.querySelector(`canvas[data-whc="${reel.id}"]`); if(!cv) return; const g=cv.getContext('2d'), E=whEntries(reel), N=E.length, R=cv.width/2, rot=WHW.rot[reel.id]||0;
  g.clearRect(0,0,cv.width,cv.height); g.save(); g.translate(R,R); if(!N){ g.restore(); return; } const seg=Math.PI*2/N; g.rotate(rot); const fs=Math.round(Math.max(13,Math.min(30,560/N)));
  for(let i=0;i<N;i++){ g.beginPath(); g.moveTo(0,0); g.arc(0,0,R-6,i*seg,(i+1)*seg); g.closePath(); const col=whColor(i,N); g.fillStyle=col; g.fill(); g.lineWidth=N>40?2:5; g.strokeStyle='#000'; g.stroke();
    if(N<=40){ g.save(); g.rotate(i*seg+seg/2); g.textAlign='right'; g.textBaseline='middle'; g.fillStyle=WH_LIGHT.includes(col)?'#000':'#fff'; g.font=`${fs}px "Archivo Black", Impact, sans-serif`; let s=E[i].t.toUpperCase(); const max=R*.7; if(g.measureText(s).width>max){ while(s.length>2&&g.measureText(s+'…').width>max) s=s.slice(0,-1); s+='…'; } g.fillText(s,R-24,0); g.restore(); } }
  g.restore(); g.beginPath(); g.arc(R,R,R*.12,0,7); g.fillStyle='#000'; g.fill(); g.lineWidth=6; g.strokeStyle='#ffc81e'; g.stroke(); }
function whUnder(reel){ const E=whEntries(reel), N=E.length; if(!N) return null; const seg=Math.PI*2/N, rot=WHW.rot[reel.id]||0; const a=((-Math.PI/2-rot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2); return E[Math.min(N-1,Math.floor(a/seg))]; }
function whSentence(W,parts){ const tpl=W.sentence||W.reels.map(r=>'{'+r.label+'}').join(' · '); let html=esc(tpl), text=tpl;
  W.reels.forEach((r,i)=>{ const v=parts[r.id]?.t||'?'; const tok='{'+r.label+'}'; html=html.split(esc(tok)).join(`<span class="whp p${i}">${esc(v)}</span>`); text=text.split(tok).join(v); }); return {html,text}; }
function whSpin(only,power=1){ if(WHW.spinning) return; const W=whActive(); const go=W.reels.filter(r=>(only?r.id===only:true)&&!(WHW.lock[r.id]&&WHW.res[r.id])); if(!go.length) return toast('Everything is kept. Unlock one to spin it.');
  for(const r of go) if(!whEntries(r).length) return toast(`The ${r.label} wheel is empty`,'bad');
  WHW.spinning=true; const t0=performance.now(); let n=0; tap();
  go.forEach((r,k)=>{ const E=whEntries(r), N=E.length, seg=Math.PI*2/N, win=Math.floor(Math.random()*N), f=.2+Math.random()*.6, start=WHW.rot[r.id]||0; let end=-Math.PI/2-(win+f)*seg; const turns=(3+k+Math.random()*1.5)*Math.max(.6,Math.min(2,power)); while(end<start+Math.PI*2*turns) end+=Math.PI*2; const dur=2600+k*700+Math.random()*300; let last=null;
    const step=now=>{ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,4); WHW.rot[r.id]=start+(end-start)*e; whDraw(r); const u=whUnder(r); const ro=$(`[data-whr="${r.id}"]`); if(ro&&u) ro.textContent=u.t; if(u&&u.key!==last){ last=u.key; if(p>.55&&IS_ANDROID){ try{ navigator.vibrate(4); }catch(_){} } }
      if(p<1) requestAnimationFrame(step); else { WHW.res[r.id]=E[win]; if(ro) ro.textContent=E[win].t; tap(); if(++n===go.length) whLanded(W); } }; requestAnimationFrame(step); }); }
function whLanded(W){ WHW.spinning=false; const parts={}; W.reels.forEach(r=>parts[r.id]=WHW.res[r.id]); const s=whSentence(W,parts); WHW.last={wheel:W.id,parts,html:s.html,text:s.text};
  const D=whData(); if(!D.local){ D.history=D.history||[]; D.history.unshift({at:Date.now(),wheel:W.id,emoji:W.emoji,text:s.text,by:myName()}); D.history=D.history.slice(0,30);
    if(W.removeWinner){ const r=W.reels[0], k=parts[r.id]?.key; if(k) r.gone=[...(r.gone||[]),k]; } touch(); }
  try{ navigator.vibrate?.([30,40,30]); }catch(e){} topPage()?.refresh?.(); $('#whScroll')?.scrollTo({top:0,behavior:'smooth'}); }
PAGES.wheel=()=>{ const el=document.createElement('div'); el.innerHTML=largeHead('Wheel of Doom')+'<div class="scroll" id="whScroll"><div class="ptr" id="ptr"></div><div class="wrap" id="whW"></div></div>';
  const render=()=>{ const D=whData(), W=whActive(), n=W.reels.length, size=n===1?320:n===2?260:220;
    $('#whW',el).innerHTML=`${D.local?`<p class="tiny" style="margin:0 4px 8px">${syncOn()?'Your wheels show up after the next sync.':'These are the starter wheels. Connect to your show to spin your own.'}</p>`:''}
      <div class="chips">${D.list.map(w=>`<button class="chip ${w.id===W.id?'on':''}" data-wh="${esc(w.id)}">${esc((w.emoji||'🎡')+' '+w.name)}</button>`).join('')}</div>
      ${WHW.last&&WHW.last.wheel===W.id?`<div class="wx-whres">${WHW.last.html}<div class="row"><button class="chip" data-wa="idea">💡 Save as idea</button><button class="chip" data-wa="write">${I.pen} Write it</button><button class="chip" data-wa="copy">Copy</button></div></div>`:`<div class="wx-whres dim">${esc((W.sentence||'').replace(/\{(\w+)\}/g,'___'))}</div>`}
      <div class="wx-reels n${n}">${W.reels.map(r=>`<div class="wx-reel"><div class="wx-ptr">▼</div><canvas data-whc="${esc(r.id)}" width="${size*2}" height="${size*2}" style="width:${size}px;height:${size}px"></canvas><div class="wx-ro"><small>${esc(r.label)}</small><b data-whr="${esc(r.id)}">${esc(WHW.res[r.id]?.t||'—')}</b>${n>1?`<button class="chip ${WHW.lock[r.id]?'on':''}" data-wl="${esc(r.id)}">${WHW.lock[r.id]?'🔒 Kept':'🔓 Keep'}</button>`:''}</div></div>`).join('')}</div>
      <button class="btn pri" data-wa="spin">🎡 Spin${n>1&&Object.values(WHW.lock).some(Boolean)?' the rest':''}</button><p class="tiny" style="text-align:center">Or flick a wheel with your thumb.</p>
      ${(D.history||[]).length?`<div class="sec">Recent spins</div><div class="list">${D.history.slice(0,8).map(h=>`<div class="li"><span>${esc(h.emoji||'🎡')}</span><div class="grow"><b style="white-space:normal">${esc(h.text)}</b><small>${h.by?esc(h.by)+' · ':''}${esc(ago(h.at))}</small></div></div>`).join('')}</div>`:''}<div style="height:30px"></div>`;
    W.reels.forEach(r=>{ whDraw(r); const cv=$(`canvas[data-whc="${r.id}"]`,el); let y0=0,x0=0,t0=0; cv.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; t0=Date.now(); },{passive:true});
      cv.addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0, v=Math.hypot(dx,dy)/Math.max(1,Date.now()-t0); if(v>.35&&Math.hypot(dx,dy)>40) whSpin(n>1?null:r.id,v); },{passive:true}); }); };
  el.addEventListener('click',e=>{ const w=e.target.closest('[data-wh]'); if(w){ tap(); WHW.active=w.dataset.wh; WHW.res={}; WHW.lock={}; WHW.last=null; return render(); }
    const l=e.target.closest('[data-wl]'); if(l){ tap(); WHW.lock[l.dataset.wl]=!WHW.lock[l.dataset.wl]; return render(); }
    const a=e.target.closest('[data-wa]')?.dataset.wa; if(a==='spin') return whSpin(); const L=WHW.last; if(!L) return;
    if(a==='copy') return navigator.clipboard?.writeText(L.text).then(()=>toast('Copied'));
    if(a==='idea'){ NW.ideas.unshift({id:uid(),x:L.text,kind:'episode',at:Date.now(),done:false,by:CFG?.name||myName()||''}); touch(); tap(); return toast('💡 Saved to the idea inbox'); }
    if(a==='write'){ const s=newScript({title:L.text.replace(/\.$/,'').toUpperCase().slice(0,70),logline:L.text,blocks:[{t:'note',x:'🎡 '+L.text}]}); setRoot('scripts'); return push('script',s.id); } });
  pullToRefresh($('#whScroll',el),$('#ptr',el)); render(); return {el,refresh:render,shown:render}; };

  setInterval(renderSyncPill,30000);
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!lsGet('nwriter.nosw',false)) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

</script>
