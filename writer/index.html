<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Nenjac Writer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nenjac Writer">
<meta name="theme-color" content="#930000">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@0,400;0,500;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --barn:#930000; --barn2:#6e0c06; --sign:#4a86e8; --sun:#ffc81e; --grass:#387520; --margin:#ff1a1a; --rule:#a4c2f4;
  --bg:#e9f0fa; --card:#ffffff; --card2:#f5f8fd; --ink:#121212; --muted:#5b6475; --line:#d5deeb; --chip:#ffffff;
  --bubble:#ffffff; --scene:#121212; --sceneInk:#ffc81e; --note:#fff2a8; --noteInk:#4a3b00;
  --display:'Archivo Black','Arial Black',system-ui,sans-serif; --ui:'Archivo',-apple-system,system-ui,sans-serif; --mono:'Courier Prime','Courier New',monospace;
  --fs:17px; --vvh:100vh; --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
  --hard:3px 3px 0 #000; color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#130a0b; --card:#21151a; --card2:#1a1013; --ink:#f4eee8; --muted:#a6979a; --line:#3a2a2e; --chip:#2a1c21;
  --bubble:#2a1c21; --scene:#000; --note:#3d3415; --noteInk:#ffe79a; --hard:3px 3px 0 #000; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#130a0b; --card:#21151a; --card2:#1a1013; --ink:#f4eee8; --muted:#a6979a; --line:#3a2a2e; --chip:#2a1c21;
  --bubble:#2a1c21; --scene:#000; --note:#3d3415; --noteInk:#ffe79a; color-scheme:dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.4 var(--ui);overscroll-behavior:none}
body{position:fixed;inset:0;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
input,textarea,select,button{font:inherit;color:inherit}
textarea,input[type=text],input[type=password],input:not([type]){-webkit-user-select:text;user-select:text}
button{border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
#app{position:absolute;left:0;right:0;top:0;height:var(--vvh);display:flex;flex-direction:column;overflow:hidden}
.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- pages (push navigation) ---------- */
#stack{position:relative;flex:1;min-height:0}
.page{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .32s cubic-bezier(.2,.8,.2,1),filter .32s}
.page.under{transform:translateX(-28%);filter:brightness(.82)}
.page.enter{transform:translateX(100%)}
.page.drag{transition:none}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.nav{flex:none;display:flex;align-items:center;gap:4px;padding:calc(var(--safeT) + 6px) 8px 8px;min-height:calc(var(--safeT) + 52px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);position:relative;z-index:5}
.nav .grow{flex:1;min-width:0}
.nbtn{min-width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--sign);font-weight:500;font-size:17px}
.nbtn:active{background:var(--line)}
.nbtn.back{display:flex;align-items:center;gap:0;padding-right:8px}
.nbtn[disabled]{opacity:.3}
.ntitle{text-align:center;min-width:0;padding:0 4px}
.ntitle b{display:block;font:400 16px/1.15 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntitle small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- home hero: the theater sign ---------- */
.hero{flex:none;position:relative;padding:calc(var(--safeT) + 10px) 16px 18px;background:
  repeating-linear-gradient(90deg,var(--barn) 0 14px,var(--barn2) 14px 18px,var(--barn) 18px 26px);color:#fff;overflow:hidden}
.hero .row1{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sign{display:inline-block;background:var(--sign);border:3px solid #000;border-radius:10px;box-shadow:var(--hard);padding:6px 14px 7px;transform:rotate(-4deg);transform-origin:left center}
.sign b{display:block;font:400 30px/0.95 var(--display);letter-spacing:.5px;color:#fff;text-shadow:2px 2px 0 #000}
.sign small{display:block;font:400 12px/1 var(--display);color:var(--sun);letter-spacing:1.5px;margin-top:3px}
.hero .show{margin-top:14px;font-size:14px;opacity:.92;display:flex;align-items:center;gap:8px;min-height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(0,0,0,.35);color:#fff;white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:#5bd16b;flex:none}
.pill[data-st="busy"] i{background:var(--sun);animation:pulse 1s infinite}
.pill[data-st="err"] i{background:#ff6b6b}.pill[data-st="off"] i{background:#aaa}.pill[data-st="local"] i{background:#aaa}
@keyframes pulse{50%{opacity:.25}}
.hero .gear{margin-left:auto;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.3);display:grid;place-items:center;color:#fff}

/* ---------- tab bar ---------- */
#tabs{flex:none;display:flex;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:4px 6px calc(var(--safeB) + 2px)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:11px;font-weight:700;color:var(--muted)}
#tabs button.on{color:var(--barn)} :root[data-dark] #tabs button.on{color:var(--sun)}
body.kb #tabs, body.pushed #tabs{display:none}

/* ---------- lists ---------- */
.wrap{padding:12px 16px calc(var(--safeB) + 110px)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:42px;margin-bottom:12px}
.search input{flex:1;border:0;background:none;outline:none;font-size:17px;min-width:0}
.search .ic{width:18px;height:18px;color:var(--muted)}
.sec{font:700 13px/1 var(--ui);color:var(--muted);margin:18px 4px 8px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font:400 20px/1.2 var(--display);color:var(--ink);margin-bottom:6px}
.scard{display:block;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:14px 14px 12px;margin-bottom:10px;border:1px solid var(--line);position:relative}
.scard:active{transform:scale(.985)}
.scard .t{display:flex;align-items:baseline;gap:8px}
.scard .t b{font:400 19px/1.15 var(--display);flex:1;min-width:0;overflow-wrap:anywhere}
.scard .code{font:700 12px/1 var(--ui);background:var(--ink);color:var(--bg);padding:4px 7px;border-radius:6px;flex:none}
.scard p{margin:6px 0 0;color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.scard .meta{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--muted)}
.faces{display:flex;margin-left:auto}
.faces .av{width:28px;height:28px;margin-left:-8px;border:2px solid var(--card)}
.fab{position:absolute;right:16px;bottom:calc(var(--safeB) + 74px);height:56px;padding:0 20px 0 16px;border-radius:28px;background:var(--sun);color:#000;border:3px solid #000;box-shadow:var(--hard);display:flex;align-items:center;gap:8px;font:400 16px var(--display);z-index:6}
.fab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}

/* avatars */
.av{width:36px;height:36px;border-radius:50%;background:var(--c,#9aa3b2);flex:none;overflow:hidden;display:grid;place-items:center;color:#fff;font:400 13px var(--display);position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.av.sq{border-radius:12px}
.av.stack{background:none;overflow:visible}
.av.stack .av{position:absolute;width:72%;height:72%;border:2px solid var(--bg);font-size:9px}
.av.stack .av:first-child{left:0;top:0}.av.stack .av:last-child{right:0;bottom:0}
.av.mini{width:26px;height:26px;font-size:10px}

/* ---------- the script ---------- */
.ed .scroll{background:var(--bg)}
#edBody{padding:10px 12px 18px;font-size:var(--fs);-webkit-user-select:none;user-select:none}
.b{position:relative;border-radius:12px;padding:8px 12px;margin:2px 0;-webkit-touch-callout:none;overflow-wrap:anywhere;white-space:pre-wrap}
.b:active{filter:brightness(.94)}
.b.sc{position:sticky;top:0;z-index:3;margin:14px -12px 8px;border-radius:0;background:var(--scene);color:var(--sceneInk);font:400 14px/1.25 var(--display);letter-spacing:.3px;padding:10px 16px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.b.ac{color:var(--ink);padding:6px 6px;margin:6px 0}
.b.tr{text-align:right;font:400 13px var(--display);color:var(--barn);padding:6px}
.b.so{text-align:center;font:400 15px var(--display);color:var(--sign);padding:10px 6px}
.b.so::before{content:'♫ '}
.b.nt{background:var(--note);color:var(--noteInk);font-size:15px;margin:8px 0;border-radius:4px 14px 14px 14px;transform:rotate(-.4deg)}
.b.nt::before{content:'Writer note  ';font-weight:700;font-size:12px;opacity:.7}
.b.cue{font:400 13px var(--display);color:var(--c);padding:2px 12px}
.grp{display:flex;gap:8px;align-items:flex-end;margin:10px 0}
.grp .av{margin-bottom:2px}
.grp .gb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.grp .who{font:400 12px/1 var(--display);color:var(--c);margin:0 0 4px 12px;letter-spacing:.3px;padding:4px 0}
.grp .b{background:var(--bubble);border:1px solid var(--line);border-radius:18px;max-width:92%;margin:1px 0}
.grp .b.dl:last-child,.grp .b.ly:last-child{border-bottom-left-radius:6px}
.grp .b.pa{background:none;border:0;font-style:italic;color:var(--muted);padding:2px 12px;font-size:15px}
.grp .b.pa::before{content:'('}.grp .b.pa::after{content:')'}
.grp .b.ly{font-style:italic;border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.grp .b.ly::before{content:'♪ ';font-style:normal;color:var(--c)}
.b.orph{background:var(--bubble);border:1px dashed var(--line);border-radius:18px}
.b.on{outline:3px solid var(--sign);outline-offset:1px}
.b .ndot{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--sun);border:2px solid #000;font-size:11px;display:grid;place-items:center;color:#000}
.b.find{box-shadow:0 0 0 3px var(--sun)}
/* editing a line in place */
.b.editing{background:var(--card)!important;border:2px solid var(--sign)!important;padding:4px 8px;max-width:100%!important;width:100%}
.b.editing::before,.b.editing::after{content:none!important}
.b.editing textarea{display:block;width:100%;border:0;outline:0;background:none;resize:none;font:inherit;line-height:1.4;padding:4px;min-height:1.4em;overflow:hidden;font-size:max(16px,var(--fs))}
/* where new lines go */
#ins{position:relative;height:30px;margin:4px 0;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:700}
#ins::before{content:'';flex:1;height:3px;border-radius:3px;background:var(--sun);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
#ins span{flex:none;background:var(--sun);color:#000;border-radius:999px;padding:3px 10px;border:2px solid #000}
#ins.end{opacity:.0;height:8px}
/* classic screenplay view */
.play #edBody{font:400 var(--fs)/1.35 var(--mono);background:var(--card);margin:10px;border-radius:6px;padding:18px 14px 18px 26px;border:1px solid var(--line);
  background-image:linear-gradient(90deg,transparent 18px,color-mix(in srgb,var(--margin) 55%,transparent) 18px 19.5px,transparent 19.5px)}
.play .b{border-radius:4px;padding:3px 4px;margin:0}
.play .b.sc{position:static;margin:16px 0 8px;background:none;color:var(--ink);font:700 var(--fs)/1.3 var(--mono);text-transform:uppercase;padding:3px 4px;box-shadow:none}
.play .b.ac{margin:8px 0}
.play .b.cue{color:var(--ink);font:700 var(--fs) var(--mono);text-align:center;margin-top:12px}
.play .b.pa{text-align:center;font-style:italic;color:var(--muted);padding:0 12%}
.play .b.pa::before{content:'('}.play .b.pa::after{content:')'}
.play .b.dl{padding:2px 9%}
.play .b.ly{padding:2px 9%;font-style:italic}.play .b.ly::before{content:'♪ '}
.play .b.tr{font:700 var(--fs) var(--mono);color:var(--ink)}
.play .b.so{font:700 var(--fs) var(--mono);color:var(--ink)}
.play .b.nt{font-family:var(--ui)}

/* ---------- composer ---------- */
.comp{flex:none;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(var(--safeB) + 6px);position:relative;z-index:6}
body.kb .comp{padding-bottom:6px}
.rail{display:flex;gap:6px;overflow-x:auto;padding:2px 10px 8px;scrollbar-width:none;align-items:center}
.rail::-webkit-scrollbar{display:none}
.rail .who{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:52px;font-size:10px;font-weight:700;color:var(--muted);padding-top:2px}
.rail .who .av{width:40px;height:40px;border:2px solid transparent;transition:transform .12s}
.rail .who span{max-width:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .who.on .av{border-color:var(--ink);transform:scale(1.08);box-shadow:0 0 0 3px var(--sun)}
.rail .who.on span{color:var(--ink)}
.rail .who.add .av{background:var(--chip);border:2px dashed var(--muted);color:var(--muted)}
.rail .sep{flex:none;width:1px;height:36px;background:var(--line);margin:0 2px}
.chip{flex:none;height:34px;padding:0 12px;border-radius:999px;background:var(--chip);border:1.5px solid var(--line);font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.red{color:var(--barn)}
.cbar{display:flex;align-items:flex-end;gap:8px;padding:0 10px}
.cbar .field{flex:1;min-width:0;background:var(--card2);border:1.5px solid var(--line);border-radius:20px;display:flex;align-items:flex-end}
.cbar .field:focus-within{border-color:var(--sign)}
.cbar .tag{flex:none;align-self:center;margin-left:10px;font:400 11px var(--display);color:var(--c,var(--muted));max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar textarea{flex:1;min-width:0;border:0;outline:0;background:none;resize:none;font-size:max(16px,var(--fs));line-height:1.35;padding:9px 12px;max-height:150px;min-height:40px}
.send{flex:none;width:42px;height:42px;border-radius:50%;background:var(--sun);border:2.5px solid #000;display:grid;place-items:center;color:#000;box-shadow:2px 2px 0 #000}
.send:active{transform:translate(2px,2px);box-shadow:none}
.send[disabled]{opacity:.35}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg:empty{display:none}
.sugg .chip{font-weight:500;font-size:13px;height:30px}
.hint{font-size:12px;color:var(--muted);padding:0 16px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint:empty{display:none}
.ebar{display:flex;gap:6px;padding:0 10px;overflow-x:auto;scrollbar-width:none}
.ebar::-webkit-scrollbar{display:none}
.ebar .chip.done{background:var(--sign);border-color:var(--sign);color:#fff;margin-left:auto}

/* ---------- sheets ---------- */
#veil{position:fixed;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:var(--kbh,0px);max-height:calc(var(--vvh) - var(--safeT) - 24px);background:var(--card);border-radius:18px 18px 0 0;z-index:41;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safeB)}
body.kb .sheet{padding-bottom:0}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex:none}
.sheet header{display:flex;align-items:center;gap:8px;padding:6px 14px 10px;flex:none}
.sheet header b{flex:1;font:400 18px var(--display)}
.sheet .body{overflow-y:auto;padding:0 16px 18px;-webkit-overflow-scrolling:touch}
.x{width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--muted)}
.acts{position:fixed;left:8px;right:8px;bottom:calc(var(--safeB) + 8px + var(--kbh,0px));z-index:42;transform:translateY(120%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.acts.on{transform:none}
.acts .grpb{background:color-mix(in srgb,var(--card) 96%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;overflow:hidden;margin-bottom:8px}
.acts .grpb p{margin:0;padding:12px 16px;text-align:center;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.acts button{display:block;width:100%;height:56px;font-size:19px;color:var(--sign);border-bottom:1px solid var(--line)}
.acts button:last-child{border-bottom:0}
.acts button.red{color:#e5372c}
.acts button.cancel{font-weight:700;background:var(--card);border-radius:14px}
/* forms */
.lab{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:14px 2px 6px}
.inp{display:block;width:100%;background:var(--card2);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:17px;outline:none}
.inp:focus{border-color:var(--sign)}
textarea.inp{resize:none;min-height:46px;line-height:1.4;overflow:hidden}
select.inp{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;background:var(--card2);border:1.5px solid var(--line);font-weight:700;font-size:17px;margin-top:10px}
.btn.pri{background:var(--sun);border:3px solid #000;box-shadow:var(--hard);color:#000;font:400 17px var(--display)}
.btn.pri:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.red{color:#e5372c}
.btn[disabled]{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);font-size:16px}
.tog small{display:block;color:var(--muted);font-size:13px}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;opacity:0;inset:0;margin:0}
.sw i{position:absolute;inset:0;border-radius:16px;background:var(--line);transition:background .2s}
.sw i::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+i{background:#34c759}.sw input:checked+i::after{transform:translateX(20px)}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.list{background:var(--card);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);min-height:52px}
.li:last-child{border-bottom:0}
.li:active{background:var(--card2)}
.li .grow{flex:1;min-width:0}

function deq(a,b){ if(a===b) return true; if(!a||!b||typeof a!=='object'||typeof b!=='object') return typeof a==='number'&&typeof b==='number'&&isNaN(a)&&isNaN(b); if(Array.isArray(a)!==Array.isArray(b)) return false;

function lcsMatch(a,b){ const n=a.length, m=b.length, res=new Int32Array(n).fill(-1); let s=0; while(s<n&&s<m&&a[s]===b[s]){ res[s]=s; s++; } let e=0; while(e<n-s&&e<m-s&&a[n-1-e]===b[m-1-e]){ res[n-1-e]=m-1-e; e++; }

/* ---------- GitHub ---------- */
const SYNC={base:{},rmap:null,cache:{},busy:false,again:false,timer:null,poll:null,err:'',offline:false,lastOk:0,fails:0,nextTry:0,prog:'',hold:null,editing:null,listeners:[]};
const syncOn=()=>!!(CFG&&CFG.on&&CFG.token);
function apiBase(){ try{ return localStorage.getItem('nenjac.ghApi')||'https://api.github.com'; }catch(e){ return 'https://api.github.com'; } }
async function gh(path,{method='GET',body,raw=false,ok404=false,cfg=CFG}={}){ const url=/^https?:/.test(path)?path:`${apiBase()}/repos/${cfg.owner}/${cfg.repo}${path}`; let res;
  try{ res=await fetch(url,{method,cache:'no-store',headers:{Authorization:'Bearer '+cfg.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined}); }
  catch(e){ const er=new Error("No internet right now. Everything is saved on your phone and syncs when you're back."); er.offline=true; throw er; }
  if(ok404&&res.status===404) return null;
  if(!res.ok){ let j={}; try{ j=await res.json(); }catch(_){} let msg=j.message||('GitHub error '+res.status);
    if(res.status===401) msg='GitHub rejected the key. It may have expired. Paste a fresh invite in Settings.';
    else if(res.status===429||(res.status===403&&/rate limit/i.test(msg))) msg='GitHub says slow down. Sync picks back up in a minute.';
    else if(res.status===403) msg="This key can read the show but can't save to it. The token needs Contents: Read and write.";
    else if(res.status===404) msg="Can't find that repo with this key. Check the name and the token's access.";
    const er=new Error(msg); er.status=res.status; throw er; }
  if(raw){ const ct=res.headers.get('content-type')||''; if(/json/.test(ct)){ const j=await res.json(); return Uint8Array.from(atob((j.content||'').replace(/\s/g,'')),ch=>ch.charCodeAt(0)); } return new Uint8Array(await res.arrayBuffer()); }
  if(res.status===204) return {}; const t=await res.text(); return t?JSON.parse(t):{}; }
async function pool(items,n,fn){ let i=0; const go=async()=>{ while(i<items.length){ const k=i++; await fn(items[k],k); } }; await Promise.all(Array.from({length:Math.min(n,items.length)},go)); }
const b64=u8=>{ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); };

/* ---------- what's on the phone, as repo files ---------- */
async function snapshot(){ const out={}, seen=new Set();
  for(const col of COLS) for(const x of NW[col]){ if(!x||typeof x!=='object') continue; if(x.id==null||seen.has(col+'/'+idSafe(x.id))) x.id=uid(); seen.add(col+'/'+idSafe(x.id));
    const p=`show/${col}/${idSafe(x.id)}.json`, text=canon(x); let c=SYNC.cache[p]; if(!c||c.text!==text){ c={text,sha:await gitShaText(text)}; SYNC.cache[p]=c; }
    out[p]={path:p,col,id:x.id,text,sha:c.sha}; }
  return out; }
function applyOne(p,text,L){ /* false = this phone changed it mid-sync, try again next round */
  const col=colOf(p), arr=NW[col]; const id=text?JSON.parse(text).id:(L[p]?.id??SYNC.base[p]?.id); const i=arr.findIndex(x=>x&&String(x.id)===String(id));
  if(col==='scripts'&&SYNC.editing&&String(SYNC.editing)===String(id)) return false;
  const now=i>=0?canon(arr[i]):null; if(now!==(L[p]?L[p].text:null)) return false;
  if(text==null){ if(i>=0) arr.splice(i,1); } else { const v=JSON.parse(text); if(i>=0) arr[i]=v; else if(col==='lore'||col==='chars') arr.unshift(v); else arr.push(v); }
  return true; }
function summary(up,dels){ const n={}, names=[]; const W2={scripts:['script','scripts'],chars:['character','characters'],lore:['lore entry','lore entries'],notes:['note','notes']};
  for(const [p,text,del] of [...up.map(u=>[u.p,u.text,false]),...dels.map(p=>[p,null,true])]){ const c=colOf(p); n[c]=(n[c]||0)+1; if(c==='scripts'&&names.length<2&&text){ try{ const t=JSON.parse(text).title; if(t) names.push(`edited “${t}”`); }catch(e){} } }
  const parts=[...names]; for(const c in n){ const k=c==='scripts'?n[c]-names.length:n[c]; if(k<=0) continue; parts.push(`${k} ${W2[c][k===1?0:1]}${c==='scripts'&&names.length?' more':''}`); }
  return (parts.join(', ')||'tidied up')+' (from the phone)'; }

async function round(){ const c=CFG; SYNC.prog='Checking'; emit();
  let ref=null; try{ ref=await gh(`/git/ref/heads/${encodeURIComponent(c.branch||'main')}`,{ok404:true}); }catch(e){ if(e.status!==409) throw e; }
  let head=ref?.object?.sha||null;
  if(head&&head===c.lastCommit&&SYNC.rmap&&!dirty) return 'same';
  dirty=false; const L=await snapshot();
  let R={}, treeSha=null, headMsg='';
  if(head&&head===c.lastCommit&&SYNC.rmap) R={...SYNC.rmap};
  else if(head){ const cm=await gh(`/git/commits/${head}`); treeSha=cm.tree.sha; headMsg=cm.message||''; const tr=await gh(`/git/trees/${treeSha}?recursive=1`); if(tr.truncated) throw new Error('The shared show is too big for GitHub to list in one go.');
    (tr.tree||[]).forEach(e=>{ if(e.type==='blob'&&(isMine(e.path)||e.path===INFO_PATH||e.path==='nenjac-show.json')) R[e.path]=e.sha; }); }
  const recR={}; for(const p in R) if(isMine(p)) recR[p]=R[p];
  const B=SYNC.base, all=new Set([...Object.keys(L),...Object.keys(B),...Object.keys(recR)]), ops=[]; let delRemote=0;
  for(const p of all){ const l=L[p]?.sha||null, b=B[p]?.sha||null, r=recR[p]||null; if(l===r){ ops.push({p,a:'same'}); continue; }
    if(l===b) ops.push({p,a:r?'pull':'delLocal'});
    else if(r===b){ ops.push({p,a:l?'push':'delRemote'}); if(!l) delRemote++; }
    else if(!l) ops.push({p,a:'pull'}); else if(!r) ops.push({p,a:'push'}); else ops.push({p,a:'merge'}); }
  if(delRemote>Math.max(5,Object.keys(B).length*.25)&&!SYNC.allowMass){ SYNC.hold={type:'mass',n:delRemote}; return 'hold'; }
  SYNC.allowMass=false;
  const need=ops.filter(o=>o.a==='pull'||o.a==='merge'), texts={}; if(need.length){ SYNC.prog=`Downloading ${need.length}`; emit(); }
  let got=0; await pool(need,6,async o=>{ texts[o.p]=DEC.decode(await gh(`/git/blobs/${recR[o.p]}`,{raw:true})); got++; if(need.length>20&&got%10===0){ SYNC.prog=`Downloading ${got}/${need.length}`; emit(); } });
  let clashes=0; const who=(headMsg.match(/^([^:—]{1,40})[:—]/)||[])[1]?.trim()||'Someone';
  for(const o of ops) if(o.a==='merge'){ const ctx={clash:0,script:o.p.startsWith('show/scripts/'),who}; const bt=B[o.p]?.text; const mv=merge3(bt?JSON.parse(bt):undefined,JSON.parse(L[o.p].text),JSON.parse(texts[o.p]),ctx);
    o.text=canon(mv); o.sha=await gitShaText(o.text); clashes+=ctx.clash; }
  /* push */
  const up=[], dels=[]; for(const o of ops){ if(o.a==='push') up.push({p:o.p,text:L[o.p].text}); if(o.a==='merge'&&o.sha!==recR[o.p]) up.push({p:o.p,text:o.text}); if(o.a==='delRemote') dels.push(o.p); }
  let newHead=head, newR={...R};
  if(up.length||dels.length){ SYNC.prog=`Saving ${up.length+dels.length}`; emit();
    if(!head){ const put=await gh(`/contents/nenjac-show.json`,{method:'PUT',body:{message:`${c.name||'Phone'}: started the shared show`,content:b64(ENC.encode(canon({app:'Nenjac Creator',format:1,show:NW.showName||'',created:Date.now()}))),branch:c.branch||'main'}});
      head=put.commit.sha; treeSha=put.commit.tree?.sha||(await gh(`/git/commits/${head}`)).tree.sha; newR={'nenjac-show.json':put.content?.sha}; }
    else if(!treeSha) treeSha=(await gh(`/git/commits/${head}`)).tree.sha;
    const entries=[]; for(const u of up){ if(u.text.length>150000){ const bl=await gh('/git/blobs',{method:'POST',body:{content:u.text,encoding:'utf-8'}}); entries.push({path:u.p,mode:'100644',type:'blob',sha:bl.sha}); } else entries.push({path:u.p,mode:'100644',type:'blob',content:u.text}); }
    dels.forEach(p=>entries.push({path:p,mode:'100644',type:'blob',sha:null}));
    const tree=await gh('/git/trees',{method:'POST',body:{base_tree:treeSha,tree:entries}});
    const msg=`${c.name||'Phone'}: ${summary(up,dels)}`;
    const cm=await gh('/git/commits',{method:'POST',body:{message:msg,tree:tree.sha,parents:[head]}});
    try{ await gh(`/git/refs/heads/${encodeURIComponent(c.branch||'main')}`,{method:'PATCH',body:{sha:cm.sha,force:false}}); }
    catch(e){ if(e.status===422||e.status===409){ const er=new Error('race'); er.race=true; throw er; } throw e; }
    newHead=cm.sha; for(const u of up) newR[u.p]=await gitShaText(u.text); dels.forEach(p=>delete newR[p]); }
  /* apply to the phone */
  const basePut=[], baseDel=[]; let pulled=0, deferred=0; const changed=new Set();
  const setBase=(p,sha,text)=>{ let id=L[p]?.id; if(id==null&&text){ try{ id=JSON.parse(text).id; }catch(e){} } if(id==null) id=SYNC.base[p]?.id; const x={k:p,sha,text,id}; SYNC.base[p]=x; basePut.push(x); };
  const dropBase=p=>{ if(SYNC.base[p]){ delete SYNC.base[p]; baseDel.push(p); } };
  for(const o of ops){ const p=o.p;
    if(o.a==='same'){ if(L[p]){ if(B[p]?.sha!==L[p].sha) setBase(p,L[p].sha,L[p].text); } else dropBase(p); }
    else if(o.a==='push') setBase(p,L[p].sha,L[p].text);
    else if(o.a==='delRemote') dropBase(p);
    else if(o.a==='pull'){ if(applyOne(p,texts[p],L)){ setBase(p,recR[p],texts[p]); pulled++; changed.add(colOf(p)); } else deferred++; }
    else if(o.a==='delLocal'){ if(applyOne(p,null,L)){ dropBase(p); pulled++; changed.add(colOf(p)); } else deferred++; }
    else if(o.a==='merge'){ if(o.sha===L[p].sha) setBase(p,o.sha,o.text); else if(applyOne(p,o.text,L)){ setBase(p,o.sha,o.text); pulled++; changed.add(colOf(p)); } else { setBase(p,L[p].sha,L[p].text); deferred++; } } }
  /* show name from the computer */
  if(R[INFO_PATH]&&R[INFO_PATH]!==c.infoSha){ try{ const t=JSON.parse(DEC.decode(await gh(`/git/blobs/${R[INFO_PATH]}`,{raw:true}))); NW.showName=t.showName||''; c.infoSha=R[INFO_PATH]; changed.add('info'); }catch(e){} }
  await DB.write('base',basePut,baseDel);
  c.lastCommit=newHead; c.lastSync=Date.now(); SYNC.rmap=newR; saveCfg(); await DB.write('kv',[{k:'remote',head:newHead,map:newR}]);
  if(changed.size){ await persistNow(); SYNC.listeners.forEach(f=>{ try{ f(changed); }catch(e){ console.warn(e); } }); }
  if(pulled&&headMsg&&!headMsg.startsWith((c.name||'Phone')+':')) toast('☁ '+headMsg.split('\n')[0].slice(0,80));
  if(clashes) toast(`✂ ${clashes} spot${clashes>1?'s were':' was'} edited in two places at once. Both versions are kept, look for the ✂ notes.`,'bad');
  if(deferred) dirty=true;
  return 'ok'; }

async function syncNow(){ if(!syncOn()) return; if(SYNC.busy){ SYNC.again=true; return; } if(SYNC.hold){ emit(); return; } if(Date.now()<SYNC.nextTry) return;
  SYNC.busy=true; SYNC.err=''; emit();
  try{ for(let tries=0;;tries++){ try{ await round(); break; }catch(e){ if(e.race&&tries<4){ await sleep(400+Math.random()*900); continue; } throw e; } }
    SYNC.fails=0; SYNC.lastOk=Date.now(); SYNC.offline=false; }
  catch(e){ console.warn('sync',e); dirty=true; SYNC.fails++; SYNC.offline=!!e.offline; SYNC.err=e.message||String(e); SYNC.nextTry=Date.now()+Math.min(300000,4000*2**Math.min(6,SYNC.fails)); }
  finally{ SYNC.busy=false; SYNC.prog=''; emit(); }
  if(SYNC.again&&!SYNC.hold){ SYNC.again=false; syncSoon(1500); } }

document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(syncOn()){ SYNC.nextTry=0; syncSoon(400); } } else { persistNow(); if(syncOn()&&dirty) syncNow(); } });
addEventListener('pagehide',()=>{ persistNow(); });
addEventListener('online',()=>{ SYNC.nextTry=0; syncSoon(600); });
function emit(){ if(typeof renderSyncPill==='function') renderSyncPill(); }

/* ---------- connecting ---------- */
function readInvite(s){ s=(s||'').trim(); const h=s.match(/#join=([^&\s]+)/); if(h) s=decodeURIComponent(h[1]); const m=s.match(/NENJAC-CREW:([A-Za-z0-9+/=]+)/); if(!m) return null; try{ return JSON.parse(decodeURIComponent(escape(atob(m[1])))); }catch(e){ return null; } }

async function connect(repoStr,token,name){ const inv=readInvite(repoStr); if(inv){ repoStr=inv.o+'/'+inv.r; token=token||inv.t||''; name=name||(inv.n?inv.n+' (iPhone)':''); }
  const rp=parseRepo(repoStr); if(!rp) throw new Error('Type the repo as owner/name, or paste the invite code from the Creator.'); if(!token) throw new Error('This invite has no key in it. On the computer, use the iPhone QR code (it includes the key), or paste a token below.');
  const cfg={...rp,token:token.trim(),name:(name||'').trim()||'iPhone',branch:'main',on:false};
  const info=await gh('',{cfg}); cfg.branch=info.default_branch||'main'; cfg.private=info.private!==false; cfg.canPush=info.permissions?info.permissions.push!==false:true;
  return cfg; }

  const lasts=C.filter(c=>{ const p=(c.name||'').toUpperCase().split(' '); return p.length>1&&p[p.length-1]===n; }); if(lasts.length===1) return lasts[0];
  if(n==='MELISSA'||n==='MARISSA') return C.find(c=>/MELISSA/i.test(c.name)); if(n==='WARREN') return C.find(c=>/^warren/i.test(c.name));

/* ---------- pages: push / pop like a real iPhone app ---------- */
const NAV={stack:[],tab:'scripts'};

function mkPage(kind,arg){ const P=PAGES[kind](arg); P.kind=kind; requestAnimationFrame(()=>$$('textarea',P.el).forEach(grow)); P.arg=arg; P.el.classList.add('page'); P.el.dataset.kind=kind; return P; }
function setRoot(tab){ NAV.tab=tab; NAV.stack.forEach(p=>{ p.leave?.(); p.el.remove(); }); NAV.stack=[]; const P=mkPage(tab); $('#stack').appendChild(P.el); NAV.stack.push(P);
  $$('#tabs [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab)); document.body.classList.remove('pushed'); P.shown?.(); }
function topPage(){ return NAV.stack[NAV.stack.length-1]; }
function push(kind,arg){ const prev=topPage(); const P=mkPage(kind,arg); P.el.classList.add('enter'); $('#stack').appendChild(P.el); NAV.stack.push(P);
  document.body.classList.add('pushed'); P.el.getBoundingClientRect(); requestAnimationFrame(()=>{ P.el.classList.remove('enter'); prev?.el.classList.add('under'); }); P.shown?.(); return P; }
function pop(){ if(NAV.stack.length<2) return; const P=NAV.stack.pop(); P.leave?.(); const prev=topPage(); document.activeElement?.blur?.();
  P.el.classList.remove('drag'); P.el.style.transform=''; prev.el.style.transform=''; prev.el.classList.remove('drag');
  P.el.classList.add('enter'); prev.el.classList.remove('under'); setTimeout(()=>P.el.remove(),340);
  if(NAV.stack.length===1) document.body.classList.remove('pushed'); prev.refresh?.(); prev.shown?.(); }
/* swipe from the left edge to go back */
(()=>{ let st=null; const S=$('#stack');
  S.addEventListener('touchstart',e=>{ if(NAV.stack.length<2||e.touches.length!==1) return; const x=e.touches[0].clientX; if(x>24) return; st={x,y:e.touches[0].clientY,t:Date.now(),on:false}; },{passive:true});
  S.addEventListener('touchmove',e=>{ if(!st) return; const dx=e.touches[0].clientX-st.x, dy=e.touches[0].clientY-st.y; if(!st.on){ if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>8){ st=null; return; } if(dx>10) st.on=true; else return; }
    const P=topPage(), prev=NAV.stack[NAV.stack.length-2], w=innerWidth, k=Math.max(0,Math.min(1,dx/w)); P.el.classList.add('drag'); prev.el.classList.add('drag'); P.el.style.transform=`translateX(${dx}px)`; prev.el.style.transform=`translateX(${-28*(1-k)}%)`; prev.el.style.filter=`brightness(${.82+.18*k})`; },{passive:true});
  S.addEventListener('touchend',e=>{ if(!st) return; const on=st.on, dx=(e.changedTouches[0].clientX-st.x), v=dx/Math.max(1,Date.now()-st.t); st=null; if(!on) return;
    const P=topPage(), prev=NAV.stack[NAV.stack.length-2]; P.el.classList.remove('drag'); prev.el.classList.remove('drag'); prev.el.style.filter='';
    if(dx>innerWidth*.33||v>.6){ pop(); } else { P.el.style.transform=''; prev.el.style.transform=''; } }); })();

const MEM=new Set(['paren','dialogue','lyric']);
const isMem=t=>MEM.has(t);
const TLABEL={dialogue:'Line',paren:'(How)',lyric:'♪ Lyric',action:'Action',scene:'Scene',transition:'Transition',song:'Song',note:'Note',character:'Name'};
const curScript=()=>byId('scripts',ED.sid);
function cleanBlock(t,x){ x=(x||'').replace(/ /g,' ').replace(/\n+/g,' '); if(t==='character') x=x.toUpperCase().trim(); if(t==='paren') x=x.trim().replace(/^\(+/,'').replace(/\)+$/,''); return x; }
function scriptStats(s){ let words=0, lines=0, rows=0; const by={};
  let cue=null; for(const b of s.blocks||[]){ const x=b.x||''; words+=wordCount(x); rows+=Math.max(1,Math.ceil(x.length/(b.t==='dialogue'?34:58)))+(b.t==='scene'||b.t==='character'||b.t==='action'?1:0);
    if(b.t==='character') cue=b.x; else if(b.t==='dialogue'||b.t==='lyric'){ lines++; if(cue) by[cue]=(by[cue]||0)+1; } else if(!isMem(b.t)) cue=null; }
  return {words,lines,pages:Math.max(rows?.1:0,rows/54),by}; }
const pagesTxt=p=>p<1?(p>0?'<1 page':'empty'):Math.round(p)+(Math.round(p)===1?' page':' pages');
function nextCode(){ let best=null; NW.scripts.forEach(s=>{ const m=(s.code||'').match(/^S(\d+)E(\d+)$/i); if(m){ const v=[+m[1],+m[2]]; if(!best||v[0]>best[0]||(v[0]===best[0]&&v[1]>best[1])) best=v; } }); return best?`S${best[0]}E${best[1]+1}`:'S1E1'; }
function lastAuthor(){ const s=[...NW.scripts].sort((a,b)=>(b.updated||0)-(a.updated||0)).find(s=>s.author); return s?s.author:''; }
function newScript(o={}){ const s={id:uid(),title:o.title||'',code:o.code||nextCode(),author:o.author||lastAuthor(),logline:o.logline||'',created:Date.now(),updated:Date.now(),blocks:o.blocks||[]}; NW.scripts.push(s); touch(); return s; }

/* long press anywhere */

function edRender(){ const s=curScript(), B=$('#edBody'); if(!s||!B) return; edTitle(); const bl=s.blocks, play=PREF.view==='play'; let h='', i=0;
  const notes=notesFor(s);

function detailsSheet(s){ const st=scriptStats(s), top=Object.entries(st.by).sort((a,b)=>b[1]-a[1]), mx=top[0]?.[1]||1;
  openSheet('Details',`<label class="lab">Title</label><input class="inp" data-f="title" value="${esc(s.title)}" autocapitalize="words">
    <div class="row"><div style="flex:1"><label class="lab">Code</label><input class="inp" data-f="code" value="${esc(s.code)}"></div><div style="flex:1.4"><label class="lab">Written by</label><input class="inp" data-f="author" value="${esc(s.author)}" autocapitalize="words"></div></div>

    <label class="lab">By the numbers</label><div class="list"><div class="li"><div class="grow"><b>${pagesTxt(st.pages)}, about ${Math.max(1,Math.round(st.pages))} min</b><small>${st.words.toLocaleString()} words, ${st.lines} lines, ${(n=>n+(n===1?' scene':' scenes'))((s.blocks||[]).filter(b=>b.t==='scene').length)}</small></div></div></div>
    ${top.length?`<label class="lab">Who talks the most</label><div class="stats">${top.slice(0,12).map(([c,n])=>`<div class="bar" style="--c:${cueColor(c)}"><b>${esc(cueName(c))}</b><i style="width:${Math.round(n/mx*55)}%"></i><span>${n}</span></div>`).join('')}</div>`:''}`,{onClose:()=>{ edTitle(); topPage().refresh?.(); }});
  $$('#sheet [data-f]').forEach(inp=>inp.addEventListener('input',()=>{ const x=byId('scripts',s.id); if(!x) return; x[inp.dataset.f]=inp.value; x.updated=Date.now(); touch(); if(inp.tagName==='TEXTAREA') grow(inp); edTitle(); })); }
function scenesSheet(s){ const sc=[]; (s.blocks||[]).forEach((b,i)=>{ if(b.t==='scene') sc.push({i,x:b.x,n:0}); else if(sc.length&&b.t==='dialogue') sc[sc.length-1].n++; });
  const body=openSheet('Scenes',sc.length?`<div class="list">${sc.map((x,k)=>`<button class="li" data-go="${x.i}"><span class="code" style="font:700 12px var(--ui);background:var(--ink);color:var(--bg);padding:4px 7px;border-radius:6px">${k+1}</span><div class="grow"><b>${esc(x.x||'(no name)')}</b><small>${x.n} line${x.n===1?'':'s'}</small></div></button>`).join('')}</div>`:'<div class="empty">No scenes yet.</div>');
  body.onclick=e=>{ const g=e.target.closest('[data-go]'); if(g){ closeSheet(); jumpTo(+g.dataset.go); } }; }
function jumpTo(i){ ED.flash=i; edRender(); const el=$(`#edBody [data-i="${i}"]`); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); }
function findSheet(s){ const body=openSheet('Find',`<div class="search">${I.search}<input id="fQ" placeholder="Word or line" autocomplete="off" type="search"></div><div id="fRes"></div>`);
  const run=()=>{ const q=$('#fQ').value.toLowerCase().trim(); if(!q){ $('#fRes').innerHTML=''; return; } const hits=[]; let cue=null; (s.blocks||[]).forEach((b,i)=>{ if(b.t==='character') cue=b.x; else if(!isMem(b.t)) cue=null; if((b.x||'').toLowerCase().includes(q)) hits.push({i,b,cue}); });
    $('#fRes').innerHTML=hits.length?`<div class="list">${hits.slice(0,80).map(h=>`<button class="li" data-go="${h.i}"><div class="grow"><b>${esc(h.cue&&isMem(h.b.t)?cueName(h.cue):TLABEL[h.b.t])}</b><small>${esc(h.b.x)}</small></div></button>`).join('')}</div>`:'<div class="empty">Not in this script.</div>'; };
  $('#fQ').oninput=run; setTimeout(()=>$('#fQ').focus(),60); body.onclick=e=>{ const g=e.target.closest('[data-go]'); if(g){ closeSheet(); jumpTo(+g.dataset.go); } }; }
function scriptText(s,chat){ const out=[`${s.title||'Untitled'}${s.code?' ('+s.code+')':''}`]; if(s.author) out.push('Written by '+s.author); if(s.logline) out.push(s.logline); out.push('');
  let cue=null; for(const b of s.blocks||[]){ const x=b.x||'';
    if(chat){ if(b.t==='character'){ cue=b.x; continue; } if(b.t==='dialogue') out.push(`${cueName(cue)}: ${x}`); else if(b.t==='paren') out.push(`  (${x})`); else if(b.t==='lyric') out.push(`${cueName(cue)} ♪ ${x}`); else if(b.t==='scene') out.push('', x); else if(b.t==='note') out.push(`[Note: ${x}]`); else out.push(x); }
    else { if(b.t==='scene') out.push('',x.toUpperCase(),''); else if(b.t==='character') out.push('','                    '+x); else if(b.t==='paren') out.push('               ('+x+')'); else if(b.t==='dialogue'||b.t==='lyric') out.push('          '+(b.t==='lyric'?'♪ ':'')+x); else if(b.t==='transition') out.push('','                                        '+x,''); else if(b.t==='note') out.push('[NOTE: '+x+']'); else out.push('',x); } }
  return out.join('\n'); }
function shareScript(s){ actions('Share “'+(s.title||'Untitled')+'”',[{label:'As a screenplay',run:()=>doShare(s,false)},{label:'As a chat (NAME: line)',run:()=>doShare(s,true)}]); }
async function doShare(s,chat){ const text=scriptText(s,chat); try{ if(navigator.share){ await navigator.share({title:s.title||'Script',text}); return; } }catch(e){ if(e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast('Copied the whole script'); }catch(e){ toast("Couldn't share",'bad'); } }

/* ---------- notes on lines (same notes as the computer) ---------- */
function notesFor(s){ const out={}; const B=s.blocks||[]; NW.notes.filter(n=>!n.done&&n.where&&n.where.type==='script'&&String(n.where.id)===String(s.id)).forEach(n=>{ let i=n.where.bi;
    const snip=(n.where.snip||'').slice(0,20); if(snip&&!((B[i]?.x||'').trim().startsWith(snip))){ const j=B.findIndex(b=>(b.x||'').trim().startsWith(snip)); if(j>=0) i=j; } if(i==null||i<0||i>=B.length) i=Math.max(0,Math.min(B.length-1,i||0)); (out[i]=out[i]||[]).push(n); }); return out; }
function noteSheet(i){ const s=curScript(), b=s.blocks[i]; if(!b) return; const list=notesFor(s)[i]||[];
  const body=openSheet('Notes',`<p class="tiny" style="margin:0 0 10px">On “${esc((b.x||'').slice(0,70))}”</p>
    ${list.map(n=>`<div class="b nt" style="transform:none"><b style="font-size:13px">${esc(n.author||'Someone')}</b> <span class="tiny">${esc(ago(n.at))}</span><div>${esc(n.text)}</div>${(n.replies||[]).map(r=>`<div style="margin-top:6px;padding-left:10px;border-left:3px solid rgba(0,0,0,.2)"><b style="font-size:13px">${esc(r.author||'Someone')}</b> ${esc(r.text)}</div>`).join('')}
      <div class="row" style="margin-top:8px"><button class="chip" data-nr="${esc(n.id)}">Reply</button><button class="chip" data-nd="${esc(n.id)}">✓ Done</button></div></div>`).join('')}
    <label class="lab">${list.length?'Add another note':'New note'}</label><textarea class="inp" id="nTxt" rows="2" placeholder="Punch this up, fix later, etc."></textarea><button class="btn pri" id="nAdd">Add note</button>`);
  $('#nTxt').oninput=e=>grow(e.target);
  $('#nAdd').onclick=()=>{ const t=$('#nTxt').value.trim(); if(!t) return; NW.notes.push({id:uid(),where:{type:'script',id:s.id,bi:i,snip:(b.x||'').trim().slice(0,60),label:`${s.title||'Untitled'} · “${(b.x||'').trim().slice(0,38)}”`},text:t,color:'#ffe066',author:CFG?.name||'Me',at:Date.now(),updated:Date.now(),done:false,replies:[]}); touch(); closeSheet(); edRender(); toast('📌 Note added'); };
  body.onclick=e=>{ const r=e.target.closest('[data-nr]'), d=e.target.closest('[data-nd]'); const n=NW.notes.find(x=>x.id===(r||d)?.dataset[r?'nr':'nd']); if(!n) return;
    if(d){ n.done=true; n.updated=Date.now(); touch(); closeSheet(); edRender(); toast('Resolved'); }
    if(r){ const t=$('#nTxt').value.trim(); if(!t){ $('#nTxt').focus(); return toast('Type the reply in the box, then tap Reply'); } n.replies=n.replies||[]; n.replies.push({text:t,author:CFG?.name||'Me',at:Date.now()}); n.updated=Date.now(); touch(); closeSheet(); toast('Replied'); } }; }

      const list=NW.lore.filter(l=>(BIB.f==='all'||l.cat===BIB.f)&&(!q||[l.title,l.body,l.cat,(l.tags||[]).join(' ')].join(' ').toLowerCase().includes(q))).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0));

function shrinkImage(file,max=480){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)), w=Math.round(im.width*k), h=Math.round(im.height*k), cv=document.createElement('canvas'); cv.width=w; cv.height=h; const g=cv.getContext('2d'); g.drawImage(im,0,0,w,h); URL.revokeObjectURL(u);
    const png=/png|gif|webp/.test(file.type); res(cv.toDataURL(png?'image/png':'image/jpeg',.85)); }; im.onerror=()=>{ URL.revokeObjectURL(u); rej(); }; im.src=u; }); }

PAGES.ideas=()=>{ const el=document.createElement('div');

    const w=e.target.closest('[data-write]'); if(w) return ideaToScript(byId('lore',w.dataset.write));

function saveIdea(t){ const first=t.split('\n')[0]; let title=first.length>70?first.slice(0,first.lastIndexOf(' ',66)>20?first.lastIndexOf(' ',66):66)+'…':first;
  const l={id:uid(),title,cat:'Episode Idea',body:t,tags:['from the phone'],at:Date.now()}; NW.lore.unshift(l); touch(); return l; }
function ideaToScript(l){ if(!l) return; const s=newScript({title:(l.title||'').replace(/…$/,'').replace(/^what if\s*/i,m=>m).slice(0,80),logline:(l.body||l.title||'').split('\n')[0]}); l.ep=s.id; touch(); setRoot('scripts'); push('script',s.id); toast('✍ New script from your idea'); }
function spark(){ const people=NW.chars.filter(c=>c.name&&(c.personality||'').length>20); const pool=people.length>=2?people:NW.chars; if(pool.length<2) return 'What if… (add a couple of characters to the Bible and I can spark ideas from them)';
  const main=pool.filter(c=>(c.tags||[]).includes('main')); const A=pick(main.length>2&&Math.random()<.7?main:pool); let B=pick(pool); for(let k=0;k<8&&B===A;k++) B=pick(pool);
  const places=NW.lore.filter(l=>l.cat==='Location'&&l.title).map(l=>l.title); const P=places.length?pick(places):'the theater';
  const a=A.name.split(' ')[0], b=B.name.split(' ')[0];
  return pick([`What if ${a} and ${b} got locked in ${P} overnight?`,`${a} gets the lead. ${b} does not take it well.`,`What if ${a} had to direct one episode?`,`${a} has to babysit ${b} for a day.`,`${a} and ${b} accidentally swap lives.`,`${a} opens a business at ${P}. It's obviously a front.`,`Everyone forgets ${a}'s birthday except ${b}, who remembers for all the wrong reasons.`,`${a} is convinced ${b} is secretly a spy.`,`What if ${a} and ${b} had to fake being best friends to win something?`,`${a} finds something in ${P} they really shouldn't have.`,`${b} owes ${a} a favor. ${a} picks the worst possible one.`,`What if ${a} went viral for the wrong reason?`]); }
/* shake for another spark */
const SHAKE={on:null,asked:false,last:0};
function askShake(){ if(SHAKE.asked) return; SHAKE.asked=true; const go=()=>addEventListener('devicemotion',e=>{ const g=e.accelerationIncludingGravity||e.acceleration; if(!g) return; const m=Math.hypot(g.x||0,g.y||0,g.z||0); if(m>28&&Date.now()-SHAKE.last>1200){ SHAKE.last=Date.now(); SHAKE.on?.(); } });
  try{ if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){ DeviceMotionEvent.requestPermission().then(s=>{ if(s==='granted'){ go(); toast('Shake your phone for another one'); } }).catch(()=>{}); } else go(); }catch(e){} }

async function runConnect(root,done){ const msg=$('#cnMsg',root), code=$('#cnCode',root).value.trim(), repo=$('#cnRepo',root)?.value.trim(), tok=$('#cnTok',root)?.value.trim(), name=$('#cnName',root)?.value.trim();

    <h2>Write Nenjac anywhere.</h2><p>Scripts and the Bible sync with the Creator on your computer, through your show's private GitHub repo.</p>
    ${PENDING&&inSafari?`<div class="card"><b style="font:400 18px var(--display)">Almost there</b><ol><li><button class="btn pri" data-a="copy" style="margin:6px 0 2px">Copy setup code</button></li><li>Tap ${I.share} Share at the bottom of Safari, then <b>Add to Home Screen</b>.</li><li>Open <b>Nenjac Writer</b> from your Home Screen and tap <b>Paste from clipboard</b>.</li></ol>
      <p class="tiny" style="margin:10px 0 0">The Home Screen app keeps its own storage, so it gets connected from there.</p></div><button class="ghost" data-a="here">Or use it right here in Safari</button>`
    :`<div class="card">${connectFormHTML()}</div>${inSafari?`<p style="margin-top:14px;font-size:14px">Tip: tap ${I.share} Share, then Add to Home Screen first. It opens full screen and works offline.</p>`:''}`}
    <button class="ghost" data-a="local">Skip for now, just write on this phone</button></div></div>`;
  el.addEventListener('click',e=>{ const a=e.target.closest('[data-a]')?.dataset.a;
    if(a==='copy'){ navigator.clipboard.writeText(PENDING.raw).then(()=>{ tap(); toast('Copied. Now Share, then Add to Home Screen'); },()=>toast("Couldn't copy",'bad')); }
    if(a==='here'){ const card=$('.card',el); card.innerHTML=connectFormHTML(); $('[data-a="go"]',el).click(); }
    if(a==='paste') pasteInto(el); if(a==='go') runConnect(el,startMain);
    if(a==='local'){ lsSet('nwriter.local',true); startMain(); } });
  return {el}; };

/* ---------- refresh after sync ---------- */
function refreshAll(changed){ for(const p of NAV.stack){ if(p.kind==='script'){ if(changed.has('scripts')||changed.has('notes')||changed.has('chars')){ if(!byId('scripts',p.arg)){ if(topPage()===p){ toast('This script was deleted on another device','bad'); pop(); } continue; } p.refresh?.(); } continue; } p.refresh?.(); } renderSyncPill(); }
SYNC.listeners.push(refreshAll);

/* ---------- boot ---------- */
function startMain(){ document.body.classList.remove('onb'); $('#tabs').style.display=''; setRoot('scripts'); renderSyncPill(); if(syncOn()){ startPolling(); SYNC.nextTry=0; syncSoon(300); } }
function showOnb(){ $('#tabs').style.display='none'; NAV.stack.forEach(p=>p.el.remove()); NAV.stack=[]; const P=mkPage('onb'); $('#stack').appendChild(P.el); NAV.stack.push(P); }
$('#tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(!b) return; tap(); if(NAV.tab===b.dataset.tab&&NAV.stack.length===1){ $('.scroll',topPage().el)?.scrollTo({top:0,behavior:'smooth'}); return; } setRoot(b.dataset.tab); });
(async()=>{ applyTheme(); fitVV();
  const raw=decodeURIComponent((location.hash.match(/join=([^&]+)/)||[])[1]||''); const inv=readInvite(raw);
  if(location.hash.includes('join=')) history.replaceState(null,'',location.pathname+location.search);
  await loadLocal(); try{ navigator.storage?.persist?.(); }catch(e){}
  if(inv) PENDING={...inv,raw:raw.includes('NENJAC-CREW:')?raw.slice(raw.indexOf('NENJAC-CREW:')):raw};
  const same=inv&&CFG&&inv.o===CFG.owner&&inv.r===CFG.repo;
  if(same){ PENDING=null; toast('Already connected to this show'); }
  if((syncOn()||lsGet('nwriter.local',false))&&!PENDING) startMain(); else showOnb();
  setInterval(renderSyncPill,30000);
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!lsGet('nwriter.nosw',false)) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

</script>
</body>
